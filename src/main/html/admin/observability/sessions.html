<!DOCTYPE html>
<html lang = "en">
    
    <head>

        <meta charset = "utf-8"/>
        <meta name = "viewport" content = "width=device-width, initial-scale=1"/>
        <meta name = "description" content = "Admin site sessions page."/>

        <link rel = "stylesheet" href = "../../css/base.css"/>
        <link rel = "stylesheet" href = "../../css/table.css"/>
        <link rel = "stylesheet" href = "../../css/loader.css"/>
        <link rel = "stylesheet" href = "../../css/logout.css"/>

        <link rel = "icon" type = "image/x-icon" href = "../../favicon.ico"/>

        <title>Gatto's Lab</title>

    </head>

    <body class = "background">

        <nav class = "navbar">

            <div class = "nav-container">

                <div class = "nav-item">
                    <img class = "nav-icon" src = "../../images/github-logo.svg" alt = "GitHub logo"/>
                    <a href = "https://github.com/Clamentos" target = "_blank">Follow me on GitHub</a>
                </div>

                <div class = "nav-item">
                    <button class = "logout-button" onclick = "logout('../../login.html')">

                    </button>
                </div>

            </div>

            <div class = "nav-crumb">
                <a href = "../../index.html">Home</a> > <a href = "../index.html">Admin</a> > Sessions

        </nav>

        <main>

            <div class = "default-container">


                <div class = "table-container">

                    <div style = "display: flex; height: 25px; justify-content: space-between">
                        <strong id = "session-count"></strong>
                        <div class = "loader" id = "loader" style = "display: none"></div>
                    </div>

                    <div class = "narrow-table">

                        <div class = "table-header-row">

                            <div style = "width: 25%">Expires At</div>
                        </div>

                        <div class = "table-data" id = "session-table-hook"></div>

                    </div>

                </div>

            </div>

            <div id = "error-container"></div>

        </main>

    </body>

    <script src = "../../js/error.js" module></script>
    <script src = "../../js/logout.js" module></script>
    <script src = "../../js/utils.js" module></script>
    <script src = "../../js/sessions.js" module></script>

</html>
