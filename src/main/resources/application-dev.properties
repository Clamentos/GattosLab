##
# SSL
sslCertificatePath = ./keystore.p12
sslKeyStorePassword = password

##..
## Public server config
# siteServer shape: domain|listening-interface|listening-port,...
# Ports 443 and 8443 will enable SSL
siteServers = |127.0.0.1|8080
siteResourcesPath = ./site
siteAllowedOrigins = http://127.0.0.1:8080
siteDiskBasedResourcesPathPrefix = disk/

##..
## Private dashboard config
# dashboardServer shape: domain|listening-interface|listening-port,...
# Ports 443 and 8443 will enable SSL
dashboardServers = |127.0.0.1|8081
dashboardResourcesPath = ./dashboard
dashboardAllowedOrigins = http://127.0.0.1:8081
loginPassword = password
cookieProperties = ; Path=/; Max-Age=
observabilityRetentionDays = 99999

##..
## HTTP proxy 
# httpProxyServer shape: domain|destination-address|destination-port|auth,...
httpProxyServers = |127.0.0.1|8082|false

##..
## Raw TCP proxy
# tcpServer shape: listening-interface|listening-port|destination-address|destination-port,...
tcpServers = 127.0.0.1|8083|127.0.0.1|8084

##..
## Miscellaneous configs
keepAliveByDefault = true
rateLimitAmount = 15
illegalPathContains = bad-string,very-bad-string

##
