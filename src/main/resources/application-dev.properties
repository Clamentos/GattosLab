##
## SSL

sslKeyStorePath = ./keystore.p12
sslKeyStorePassword = password

##..
## Public server config (ports 443 and 8443 will enable SSL)

# csv of {listening-interface}|{listening-port}, ...
siteServers = 127.0.0.1|8080

# csv of {resources-path}|{domain}, ...
# must specify all known domains
siteResources = ./site|127.0.0.1:8080

# csv of {origin}, ...
siteAllowedOrigins = http://127.0.0.1:8080,http://localhost:8080

siteDiskBasedResourcesPathPrefix = disk/

##..
## Private dashboard config (ports 443 and 8443 will enable SSL)

# csv of {listening-interface}|{listening-port}, ...
dashboardServers = 127.0.0.1|8081

dashboardResourcesPath = ./dashboard

# csv of {origin}, ...
dashboardAllowedOrigins = http://127.0.0.1:8081,http://localhost:8081

loginPassword = password
cookieProperties = ; Path=/; Max-Age=
observabilityRetentionDays = 99999

##..
## HTTP proxy

# csv of {domain}|{destination-address}|{destination-port}|{auth-enabled}, ...
httpProxyServers = localhost:8080|192.168.1.138|8080|false

# csv of {resource-path}, ...
httpProxyAuthExclusions = 

#csv of {header-name}, ...
httpProxyCustomHeaders = custom-header,custom-header-2

##..
## Raw TCP proxy

# csv of {listening-interface}|{listening-port}|{destination-address}|{destination-port}, ...
tcpServers = 127.0.0.1|8082|127.0.0.1|8083

##..
## Miscellaneous configs

keepAliveByDefault = true
rateLimitAmount = 100
illegalPathContains = bad-string,very-bad-string

##
