app:
  batch:
    poolSize: 5
    terminationWaitPeriod: 10 # Seconds
  database:
    connectionString: "mongodb://localhost:27017/GattosLabTestMongoDB"
  logs:
    logsRetention: 7 # Days
    retentionSchedule: "0 0 0 * * *" # Every day at 00:00:00
    squashSchedule: "0 * * * * *" # Every minute
  metrics:
    dumpToDbSchedule: "0 * * * * *" # Every minute
    enabled: true # Affects all types
    siphonCapacity: 5000
    systemMetricsRetention: 7 # Days
    systemMetricsSampling: "*/10 * * * * *" # Every 10 seconds
    requestMetricsRetention: 7 # Days
    retentionSchedule: "0 0 0 * * *" # Every day at 00:00:00
  ratelimit:
    enabled: true
    maxTokensPerIp: 100 #200
    replenishRate: 1000 #10000 # Milliseconds
    retryAfter: 2000 #60000 # Milliseconds
  session:
    admin:
      apiKey: "test"
      cookieAttributes: "=$; Path=/;"
      maxSessions: 10
      sessionDuration: 28800 # Seconds
    cookieName: "GattosLabSessionId"
    cleanSchedule: "0 * * * * *" # Every minute
    cors:
      origins: "http://localhost:8443"
    enabled: true
    loginDelay: 500 # Milliseconds
  site:
    cacheDuration: 10080 # Minutes
    root: site
security:
  require-ssl: true
server:
  compression:
    enabled: false
  connection-timeout: 30000 # Milliseconds
  forward-headers-strategy: "framework"
  http2:
    enabled: true
  max-http-request-header-size: 2048 # Bytes
  port: 8443
  shutdown: "graceful"
  #ssl:
  #  key-store: classpath:keystore.p12
  #  key-store-password: password
  #  key-store-type: PKCS12
  #  key-alias: http2-alias
  tomcat:
    accept-count: 256 # Maximum pending connection queue depth
    max-connections: 8192
    max-keep-alive-requests: 256
    max-swallow-size: 1048576 # Bytes
    processor-cache: 256 # Number of request "processors" to keep cached (to avoid frequent object creation)
spring:
  application:
    name: "Gatto's lab"
  jackson:
    default-property-inclusion: "non_null"
    deserialization:
      fail-on-unknown-properties: true
  jmx:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: "15s" # Seconds
  mvc:
    publish-request-handled-events: false
  profiles:
    active: "test"
  threads:
    virtual:
      enabled: true
  web:
    resources:
      add-mappings: false
