# TODO: finish setting up based on VPS

##
## SSL

# mandatory
sslKeyStorePath = $SSL_CERTIFICATE_PATH

# mandatory
sslKeyStorePassword = $KEY_STORE_PASSWORD

##..
## Public server config (ports 443 and 8443 will enable SSL)

# mandatory csv of {listening-interface}|{listening-port}, ...
siteServers = [::]|443

# mandatory csv of {resources-path}|{domain}, ...
# must specify all known site domains
siteResources = ./site|gattoslab.dev,./site|www.gattoslab.dev,./site|mail.gattoslab.dev

# mandatory csv of {origin}, ...
siteAllowedOrigins = https://gattoslab.dev,https://www.gattoslab.dev

# optional
siteDiskBasedResourcesPathPrefix = disk/

##..
## Private dashboard config (ports 443 and 8443 will enable SSL)

# mandatory csv of {listening-interface}|{listening-port}, ...
dashboardServers = 127.0.0.1|8443

# mandatory
dashboardResourcesPath = ./dashboard

# mandatory csv of {origin}, ...
dashboardAllowedOrigins = http://127.0.0.1:8443,http://localhost:8443

# mandatory
loginPassword = $LOGIN_PASSWORD

# mandatory
cookieProperties = ; Secure; HttpOnly; Domain=gattoslab.dev; SameSite=Strict; Path=/; Max-Age=

# mandatory
observabilityRetentionDays = 30

##..
## HTTP proxy (domain-based)

# optional csv of {domain}|{destination-address}|{destination-port}|{auth-enabled}|{proxy-keep-alive-ms}, ...
httpProxyServers = vpn.gattoslab.dev|127.0.0.1|8080|false|300000

# optional csv of {resource-path}, ...
httpProxyAuthExclusions = 

##..
## Raw TCP proxy

# optional csv of {listening-interface}|{listening-port}|{destination-address}|{destination-port}|{proxy-keep-alive-ms}, ...
tcpServers = 

##..
## Miscellaneous configs

# mandatory
rateLimitAmount = 100

# mandatory
illegalPathContains = $ILLEGAL_PATH_CONTAINS

##
